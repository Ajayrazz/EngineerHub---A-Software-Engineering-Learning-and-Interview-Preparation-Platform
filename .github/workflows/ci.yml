name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to full commit SHAs (supply-chain hardening, docs/09 T18).
# Scanners run as pinned container images, not marketplace actions.
env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
  OSV_IMAGE: ghcr.io/google/osv-scanner:v2.7.1
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12

jobs:
  backend:
    name: Backend (build, unit + integration tests, format, module boundaries, API contract)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (spotless, unit tests, Modulith verification, OpenAPI contract, Testcontainers ITs)
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  frontend:
    name: Frontend (lint, typecheck, format, API client sync, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo \
            --config /repo/.gitleaks.toml --redact --no-banner

  dependency-scan:
    name: Dependency vulnerability scan (OSV; resolved Maven tree via SBOM + npm lockfile)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Generate Maven SBOM (full resolved dependency tree)
        working-directory: backend
        run: ./mvnw -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom -DoutputFormat=json -DincludeTestScope=false
      - name: OSV scan (fails on any known vulnerability)
        run: |
          docker run --rm -v "$PWD:/w" "$OSV_IMAGE" scan source \
            -L /w/backend/target/bom.json -L /w/frontend/package-lock.json

  dev-stack:
    name: Dev stack (Docker Compose up + end-to-end verification)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start stack
        run: make dev-up
      - name: Verify stack
        run: make dev-verify
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build API jar
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests -DskipITs
      - name: Start API against the dev stack and verify authentication/authorization with real Keycloak tokens
        run: |
          set -a; . ./.env; set +a
          SPRING_PROFILES_ACTIVE=local java -jar backend/target/engineerhub-backend-0.1.0-SNAPSHOT.jar > api.log 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health >/dev/null && break; sleep 2; done
          API_LOG=api.log ./scripts/verify-api-auth.sh
      - name: Dump API log on failure
        if: failure()
        run: tail -n 200 api.log || true
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  workflow-lint:
    name: Workflow and shell script lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color
      - name: Shell script lint (shellcheck, preinstalled on runners)
        run: shellcheck -S warning scripts/*.sh .githooks/pre-commit infra/postgres/init/*.sh
