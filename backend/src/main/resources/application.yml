spring:
  application:
    name: engineerhub-api
  threads:
    virtual:
      enabled: true

  # --- Database (required; no defaults: the app refuses to start unconfigured) ---
  # Non-local environments provide DB_URL / DB_USER / DB_PASSWORD (e.g. jdbc:postgresql://host:5432/engineerhub).
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false # no lazy loading in the web layer; services load what they need
    hibernate:
      ddl-auto: validate # schema is owned by Flyway; Hibernate only verifies the mapping matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --- Redis (rate limiting; required unless engineerhub.limits.rate.enabled=false) ---
  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms # a slow Redis must never stall requests (the limiter fails open)

  # --- RabbitMQ (required; no defaults — never fall back to guest/guest. See RabbitConnectionGuard) ---
  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    publisher-confirm-type: correlated # the relay waits for the broker's confirm before marking an event published
    template:
      mandatory: true # required for returns to be reported
    publisher-returns: true # unroutable messages are reported back (logged + counted), never silently ignored
    listener:
      simple:
        acknowledge-mode: auto # ack on success; exception => retry, then dead-letter
        default-requeue-rejected: false # rejected messages go to the dead-letter exchange, never hot-loop
        prefetch: 10
        retry:
          enabled: true
          max-retries: 2 # retries AFTER the first attempt (Boot 4 / Spring Framework 7 semantics) => 3 attempts in total
          initial-interval: 500ms
          multiplier: 2.0
          max-interval: 5s

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true # never allow a wipe from application config

  jackson:
    # RFC 9457 problem details are produced by GlobalExceptionHandler, not by the default error path.
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: false # our handler extends ResponseEntityExceptionHandler and owns the format

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health # only health is exposed over HTTP
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# --- Transactional outbox (see shared.messaging) ---
engineerhub:
  billing:
    reconciliation:
      enabled: ${BILLING_RECONCILIATION_ENABLED:true} # nightly comparison with the provider (also runnable by hand)
      cron: ${BILLING_RECONCILIATION_CRON:0 30 2 * * *}
    renewal-window-days: ${BILLING_RENEWAL_WINDOW_DAYS:7} # "Renew" reminder appears this many days before access ends (default, not a decision)
    razorpay:
      # TEST MODE ONLY until the Live Readiness Gate (docs/21 §9): live keys are refused at startup.
      mode: ${RAZORPAY_MODE:test}
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
  keycloak:
    admin: # service-account client for role management (blank = role management refused)
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
  limits:
    max-request-bytes: 1048576 # 1 MiB; larger bodies get 413 before any parsing (code submissions will use a lower per-route cap)
    rate:
      enabled: true
      window: 60s
      read-per-window: 300 # GET/HEAD per principal (user, or client address when anonymous)
      write-per-window: 60 # POST/PUT/PATCH/DELETE
      admin-per-window: 120 # everything under /api/v1/admin
  outbox:
    relay:
      enabled: true # exactly the processes that should publish; safe to run on several (SKIP LOCKED)
      poll-interval: 500ms
      batch-size: 50
      confirm-timeout: 5s
    retention: 7d # published rows are purged after this

# --- Security (see SecurityProperties) ---
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:} # required, e.g. http://localhost:8081/realms/engineerhub
      audience: ${JWT_AUDIENCE:engineerhub-api}
    # State-changing endpoints that may be called without a login: only server-to-server callbacks that
    # authenticate themselves (here the Razorpay webhook, verified by its HMAC signature).
    public-mutation-paths: /api/v1/webhooks/razorpay
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:} # comma-separated; empty = no CORS
    content-security-policy: "default-src 'none'; frame-ancestors 'none'"

# --- Logging: structured JSON on the console by default (correlationId from MDC is included) ---
logging:
  structured:
    format:
      console: ecs

# API docs / Swagger UI are OFF unless explicitly enabled (secure by default: don't advertise the API surface).
# Enabled for the 'local' profile (application-local.yml) and by the OpenAPI contract test.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
