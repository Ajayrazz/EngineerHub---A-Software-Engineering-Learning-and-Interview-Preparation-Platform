spring:
  application:
    name: engineerhub-api
  threads:
    virtual:
      enabled: true

  # --- Database (required; no defaults: the app refuses to start unconfigured) ---
  # Non-local environments provide DB_URL / DB_USER / DB_PASSWORD (e.g. jdbc:postgresql://host:5432/engineerhub).
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false # no lazy loading in the web layer; services load what they need
    hibernate:
      ddl-auto: validate # schema is owned by Flyway; Hibernate only verifies the mapping matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true # never allow a wipe from application config

  jackson:
    # RFC 9457 problem details are produced by GlobalExceptionHandler, not by the default error path.
    default-property-inclusion: non_null

  mvc:
    problemdetails:
      enabled: false # our handler extends ResponseEntityExceptionHandler and owns the format

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health # only health is exposed over HTTP
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# --- Security (see SecurityProperties) ---
engineerhub:
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:} # required, e.g. http://localhost:8081/realms/engineerhub
      audience: ${JWT_AUDIENCE:engineerhub-api}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:} # comma-separated; empty = no CORS
    content-security-policy: "default-src 'none'; frame-ancestors 'none'"

# --- Logging: structured JSON on the console by default (correlationId from MDC is included) ---
logging:
  structured:
    format:
      console: ecs

# API docs / Swagger UI are OFF unless explicitly enabled (secure by default: don't advertise the API surface).
# Enabled for the 'local' profile (application-local.yml) and by the OpenAPI contract test.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
