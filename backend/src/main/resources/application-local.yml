# Local development profile (SPRING_PROFILES_ACTIVE=local, set by `make backend-run`).
# Defaults match the Docker Compose dev stack and .env.example (FAKE dev-only values).
# NEVER use this profile in staging/production.
spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5440}/${APP_DB_NAME:engineerhub}
    username: ${APP_DB_USER:engineerhub_app}
    password: ${APP_DB_PASSWORD:dev-only-app-pw}

  data:
    redis:
      host: localhost
      port: ${REDIS_HOST_PORT:6380}
      password: ${REDIS_PASSWORD:dev-only-redis-pw}

  rabbitmq:
    host: localhost
    username: ${RABBITMQ_USER:engineerhub}
    password: ${RABBITMQ_PASSWORD:dev-only-rabbit-pw}
    virtual-host: ${RABBITMQ_VHOST:engineerhub}

engineerhub:
  limits:
    rate:
      # Local development and the browser E2E suite issue many requests as a handful of users; production keeps
      # the defaults from application.yml (300 / 60 / 120 per minute).
      read-per-window: 6000
      write-per-window: 1200
      admin-per-window: 2400
  security:
    jwt:
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/engineerhub}
    # Swagger UI needs inline scripts/styles; acceptable for local only.
    content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'"

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  structured:
    format:
      console: # blank = human-readable console in local development
  pattern:
    level: "%5p [%X{correlationId:-}]"
