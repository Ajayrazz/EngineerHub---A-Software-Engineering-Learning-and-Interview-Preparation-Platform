components:
  schemas:
    PreferencesRequest:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
        locale:
          type: string
          minLength: 1
          pattern: ^en$
      required:
      - locale
      - timezone
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        timezone:
          type: string
        locale:
          type: string
        createdAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        website:
          type: string
        githubUrl:
          type: string
        linkedinUrl:
          type: string
    ProgressUpdate:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          pattern: ^(in_progress|completed)$
        scrollPct:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
      required:
      - status
    CourseProgress:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        enrolled:
          type: boolean
        totalLessons:
          type: integer
          format: int32
        completedLessons:
          type: integer
          format: int32
        percent:
          type: integer
          format: int32
        completed:
          type: boolean
        completedLessonIds:
          type: array
          items:
            type: string
            format: uuid
        resume:
          $ref: "#/components/schemas/ResumeTarget"
        enrolledAt:
          type: string
          format: date-time
    ResumeTarget:
      type: object
      properties:
        lessonId:
          type: string
          format: uuid
        lessonSlug:
          type: string
        lessonTitle:
          type: string
    StatusChangeRequest:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          pattern: ^(active|suspended)$
        reason:
          type: string
