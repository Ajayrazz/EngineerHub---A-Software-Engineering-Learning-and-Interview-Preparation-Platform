openapi: 3.1.0
info:
  title: EngineerHub API
  description: Public REST API of the EngineerHub platform.
  version: v1
servers:
- url: http://localhost
  description: Generated server url
paths:
  /api/v1/me/preferences:
    put:
      tags:
      - me-controller
      operationId: updatePreferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/admin/users/{id}/status:
    put:
      tags:
      - admin-controller
      operationId: changeStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusChangeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
  /api/v1/admin/users/{id}/roles:
    get:
      tags:
      - admin-controller
      operationId: rolesOf
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RolesView"
    put:
      tags:
      - admin-controller
      operationId: setRoles
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesChangeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RolesView"
  /api/v1/admin/users/{id}/grants:
    get:
      tags:
      - admin-controller
      operationId: grants
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GrantView"
    post:
      tags:
      - admin-controller
      operationId: grant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GrantView"
  /api/v1/me/profile:
    patch:
      tags:
      - me-controller
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdateRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/system/whoami:
    get:
      tags:
      - system-controller
      operationId: whoami
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/WhoAmI"
  /api/v1/system/ping:
    get:
      tags:
      - system-controller
      operationId: ping
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Ping"
  /api/v1/system/admin/ping:
    get:
      tags:
      - system-controller
      operationId: adminPing
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Ping"
  /api/v1/me:
    get:
      tags:
      - me-controller
      operationId: me
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/me/permissions:
    get:
      tags:
      - my-permissions-controller
      operationId: mine
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PermissionsResponse"
  /api/v1/admin/users:
    get:
      tags:
      - admin-controller
      operationId: users
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPage"
  /api/v1/admin/users/{id}:
    get:
      tags:
      - admin-controller
      operationId: user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserView"
  /api/v1/admin/roles:
    get:
      tags:
      - admin-controller
      operationId: roles
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoleView"
  /api/v1/admin/audit-logs:
    get:
      tags:
      - audit-controller
      operationId: search
      parameters:
      - name: actor
        in: query
        required: false
        schema:
          type: string
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: resourceType
        in: query
        required: false
        schema:
          type: string
      - name: resourceId
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 50
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageOfEntries"
  /api/v1/admin/audit-logs/verify:
    get:
      tags:
      - audit-controller
      operationId: verify
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Result"
  /api/v1/admin/users/{id}/grants/{grantId}:
    delete:
      tags:
      - admin-controller
      operationId: revoke
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: grantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: No Content
components:
  schemas:
    PreferencesRequest:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
        locale:
          type: string
          minLength: 1
          pattern: ^en$
      required:
      - locale
      - timezone
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        timezone:
          type: string
        locale:
          type: string
        createdAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        website:
          type: string
        githubUrl:
          type: string
        linkedinUrl:
          type: string
    StatusChangeRequest:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          pattern: ^(active|suspended)$
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - reason
      - status
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        status:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    RolesChangeRequest:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            minLength: 1
            pattern: "^[A-Z_]{3,30}$"
          maxItems: 6
          minItems: 0
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - reason
      - roles
    RolesView:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
    GrantRequest:
      type: object
      properties:
        permission:
          type: string
          minLength: 1
          pattern: "^[a-z][a-z0-9]*(\\.[a-z][a-z0-9]*)+$"
        resourceType:
          type: string
          minLength: 1
          pattern: "^[a-z][a-z-]{1,39}$"
        resourceId:
          type: string
          minLength: 1
          pattern: "^[A-Za-z0-9._:-]{1,100}$"
        expiresAt:
          type: string
          format: date-time
      required:
      - permission
      - resourceId
      - resourceType
    GrantView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        permission:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        grantedBy:
          type: string
          format: uuid
        grantedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ProfileUpdateRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          minLength: 0
        bio:
          type: string
          maxLength: 500
          minLength: 0
        website:
          type: string
        githubUrl:
          type: string
        linkedinUrl:
          type: string
    WhoAmI:
      type: object
      properties:
        subject:
          type: string
        roles:
          type: array
          items:
            type: string
    Ping:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        time:
          type: string
          format: date-time
    PermissionsResponse:
      type: object
      properties:
        global:
          type: array
          items:
            type: string
        scopedCapabilities:
          type: array
          items:
            type: string
        grants:
          type: array
          items:
            $ref: "#/components/schemas/ScopedGrantView"
    ScopedGrantView:
      type: object
      properties:
        permission:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/UserView"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
    RoleView:
      type: object
      properties:
        role:
          type: string
        global:
          type: array
          items:
            type: string
        scoped:
          type: array
          items:
            type: string
    Entry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        actorSub:
          type: string
        actorRoles:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        before:
          type: string
        after:
          type: string
        reason:
          type: string
        correlationId:
          type: string
    PageOfEntries:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Entry"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        hasNext:
          type: boolean
    Result:
      type: object
      properties:
        ok:
          type: boolean
        checked:
          type: integer
          format: int64
        firstBadId:
          type: integer
          format: int64
        problem:
          type: string
