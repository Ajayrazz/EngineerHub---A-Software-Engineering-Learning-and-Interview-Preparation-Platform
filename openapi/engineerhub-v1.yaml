components:
  schemas:
    PreferencesRequest:
      type: object
      properties:
        timezone:
          type: string
          minLength: 1
        locale:
          type: string
          minLength: 1
          pattern: ^en$
      required:
      - locale
      - timezone
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        status:
          type: string
        roles:
          type: array
          items:
            type: string
        timezone:
          type: string
        locale:
          type: string
        createdAt:
          type: string
          format: date-time
        profile:
          $ref: "#/components/schemas/Profile"
    Profile:
      type: object
      properties:
        displayName:
          type: string
        bio:
          type: string
        website:
          type: string
        githubUrl:
          type: string
        linkedinUrl:
          type: string
    ProgressUpdate:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          pattern: ^(in_progress|completed)$
        scrollPct:
          type: integer
          format: int32
          maximum: 100
          minimum: 0
      required:
      - status
    CourseProgress:
      type: object
      properties:
        courseId:
          type: string
          format: uuid
        enrolled:
          type: boolean
        totalLessons:
          type: integer
          format: int32
        completedLessons:
          type: integer
          format: int32
        percent:
          type: integer
          format: int32
        completed:
          type: boolean
        completedLessonIds:
          type: array
          items:
            type: string
            format: uuid
        resume:
          $ref: "#/components/schemas/ResumeTarget"
        enrolledAt:
          type: string
          format: date-time
    ResumeTarget:
      type: object
      properties:
        lessonId:
          type: string
          format: uuid
        lessonSlug:
          type: string
        lessonTitle:
          type: string
    StatusChangeRequest:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          pattern: ^(active|suspended)$
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - reason
      - status
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        status:
          type: string
        timezone:
          type: string
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
    RolesChangeRequest:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
            minLength: 1
            pattern: "^[A-Z_]{3,30}$"
          maxItems: 6
          minItems: 0
        reason:
          type: string
          maxLength: 500
          minLength: 5
      required:
      - reason
      - roles
    RolesView:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
    ProgramRequest:
      type: object
      properties:
        language:
          type: string
          minLength: 1
          pattern: ^(java|python|cpp)$
        source:
          type: string
          maxLength: 64000
          minLength: 0
      required:
      - language
      - source
    ProgramView:
      type: object
      properties:
        role:
          type: string
        language:
          type: string
        source:
          type: string
        sha256:
          type: string
        updatedAt:
          type: string
          format: date-time
    RunView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        testcaseVersion:
          type: integer
          format: int32
        generatedCases:
          type: integer
          format: int32
        testsChecked:
          type: integer
          format: int32
        generatedChecked:
          type: integer
          format: int32
        executor:
          type: string
        summary:
          type: string
        counterexample:
          type: string
        requestedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    ValidationView:
      type: object
      properties:
        validationStatus:
          type: string
        testcaseVersion:
          type: integer
          format: int32
        executorAvailable:
          type: boolean
        programs:
          type: array
          items:
            $ref: "#/components/schemas/ProgramView"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/RunView"
    TestInput:
      type: object
      properties:
        input:
          type: string
          maxLength: 100000
          minLength: 0
        expected:
          type: string
          maxLength: 100000
          minLength: 0
        sample:
          type: boolean
        explanation:
          type: string
          maxLength: 2000
          minLength: 0
      required:
      - expected
      - input
    TestsRequest:
      type: object
      properties:
        tests:
          type: array
          items:
            $ref: "#/components/schemas/TestInput"
          maxItems: 200
          minItems: 0
        expectedTestcaseVersion:
          type: integer
          format: int32
      required:
      - expectedTestcaseVersion
      - tests
    TestView:
      type: object
      properties:
        ordinal:
          type: integer
          format: int32
        sample:
          type: boolean
        input:
          type: string
        expected:
          type: string
        explanation:
          type: string
    TestsView:
      type: object
      properties:
        testcaseVersion:
          type: integer
          format: int32
        validationStatus:
          type: string
        tests:
          type: array
          items:
            $ref: "#/components/schemas/TestView"
    TagsRequest:
      type: object
      properties:
        topicIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 0
        patternIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 10
          minItems: 0
      required:
      - patternIds
      - topicIds
    ProblemView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
        difficulty:
          type: string
        accessTier:
          type: string
        statement:
          type: string
        inputFormat:
          type: string
        outputFormat:
          type: string
        constraints:
          type: string
        hints:
          type: array
          items:
            type: string
        timeLimitMs:
          type: integer
          format: int32
        memoryLimitMb:
          type: integer
          format: int32
        checkerType:
          type: string
        version:
          type: integer
          format: int32
        testcaseVersion:
          type: integer
          format: int32
        sampleCount:
          type: integer
          format: int32
        hiddenCount:
          type: integer
          format: int32
        validationStatus:
          type: string
        publishedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        hasUnpublishedChanges:
          type: boolean
        topics:
          type: array
          items:
