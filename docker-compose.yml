# EngineerHub local development stack. NOT a production topology (see docs/15).
# All ports bind to 127.0.0.1 only. Images are pinned; bump deliberately (docs/22).
name: engineerhub

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?run make dev-env}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      APP_DB_NAME: ${APP_DB_NAME:?}
      APP_DB_USER: ${APP_DB_USER:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:?}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5440}:5432"]   # 5440 default: avoids clashing with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql          # PG 18 images expect the mount at this parent path
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"]   # 6380 default: avoids clashing with a local Redis on 6379
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.3.8-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:?}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # management UI
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]   # dev mode only; prod uses `start` with TLS + strict hostname
    depends_on:
      postgres: { condition: service_healthy }
      mailpit: { condition: service_started }
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      # Substituted into the realm import via ${...} placeholders
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET:?}
    ports: ["127.0.0.1:8081:8080"]
    volumes:
      - ./infra/keycloak/realm:/opt/keycloak/data/import:ro
    healthcheck:
      # No curl in the image: speak HTTP over bash /dev/tcp to the management port (9000).
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI

  s3:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?}
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
    volumes: [s3data:/data]

  s3-init:
    image: amazon/aws-cli:latest
    depends_on: [s3]
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do aws --endpoint-url http://s3:9000 s3 ls >/dev/null 2>&1 && break; sleep 2; done
        for b in ${S3_BUCKET_MEDIA:?} ${S3_BUCKET_TESTDATA:?}; do
          aws --endpoint-url http://s3:9000 s3api head-bucket --bucket $$b 2>/dev/null || aws --endpoint-url http://s3:9000 s3 mb s3://$$b
        done
        aws --endpoint-url http://s3:9000 s3 ls

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  s3data:
